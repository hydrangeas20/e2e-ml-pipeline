[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mlpipe"
version = "2.0.0.dev0"
description = "Model lifecycle, serving, controlled rollout and automatic rollback for the e2e-ml-pipeline"
requires-python = ">=3.11"
authors = [{ name = "hydrangeas20", email = "hamda@duck.com" }]
dependencies = [
  "fastapi==0.128.0",
  "uvicorn==0.40.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "scikit-learn==1.8.0",
  "numpy==2.4.1",
  "pandas==2.3.3",
  "skops==0.16.0",
  "prometheus-client==0.26.0",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "anyio==4.12.1",
  "starlette==0.50.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "mypy==2.4.1", "pandas-stubs", "types-PyYAML"]

[project.scripts]
mlpipe = "mlpipe.cli:main"

[tool.setuptools.packages.find]
include = ["mlpipe*"]

[tool.setuptools.package-data]
mlpipe = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real-server / subprocess tests", "docker: needs a docker daemon"]
filterwarnings = ["error", "ignore::DeprecationWarning:skops.*", "ignore:.*InconsistentVersionWarning.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["mlruns", "src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mlpipe"]

[[tool.mypy.overrides]]
module = ["skops.*", "sklearn.*", "prometheus_client.*"]
ignore_missing_imports = true
